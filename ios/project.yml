name: ScanRimonim
options:
  bundleIdPrefix: ar.com.rimonim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
targets:
  ScanRimonim:
    type: application
    platform: iOS
    sources:
      - path: ScanRimonim
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.rimonim.scanlidar
        PRODUCT_NAME: Scan Rimonim LiDAR
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scan LiDAR
        INFOPLIST_KEY_NSCameraUsageDescription: La cámara y el LiDAR se usan para medir calibre y color de las granadas.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: La ubicación se guarda con cada foto para saber dónde se tomó la muestra.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
