name: iOS app (LiDAR)

on:
  push:
    branches: [claude/ios-app]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Subir a TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          ls -d /Applications/Xcode_*.app; sudo xcode-select -s "$(ls -d /Applications/Xcode_2[6-9]*.app | grep -iv beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar (sin firma)
        run: |
          set -o pipefail
          xcodebuild -project ScanRimonim.xcodeproj -scheme ScanRimonim \
            -destination 'generic/platform=iOS' -configuration Release \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Errores de compilación
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80

      - name: Archivar y subir a TestFlight
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.testflight) || contains(github.event.head_commit.message, '[testflight]') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eo pipefail
          falta=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret $v (APPLE_TEAM_ID para TEAM_ID)"; falta=1; fi
          done
          [ "$falta" = 0 ]
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Normaliza la clave (saltos de línea de Windows, espacios, todo en una línea, etc.)
          python3 - "$KEY" <<'PY'
          import os, re, sys
          raw = os.environ["ASC_KEY_P8"].replace("\r", "")
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          print(f"Clave: encabezado={'BEGIN PRIVATE KEY' in raw}, largo base64={len(body)} (esperado ~200)")
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          open(sys.argv[1], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n")
          PY
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ScanRimonim.xcodeproj -scheme ScanRimonim \
            -destination 'generic/platform=iOS' -configuration Release \
            -clonedSourcePackagesDirPath .spm \
            -archivePath "$RUNNER_TEMP/ScanRimonim.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO archive | tail -20
          # El archivo se firma al exportar (firma de distribución gestionada en la nube)
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ScanRimonim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -30
          rm -f "$KEY"
