name: Agregar testers TestFlight

on:
  push:
    branches: [claude/ios-app]
    paths: [".github/asc-testers-trigger"]

jobs:
  testers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet "pyjwt[crypto]" requests
      - name: Agregar testers al grupo externo
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 .github/scripts/asc_add_testers.py
